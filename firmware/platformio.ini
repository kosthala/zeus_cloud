; Zeus alarm-panel gateway (ESP32)
[env:esp32dev]
; Pinned: the watchdog / WiFi APIs differ between Arduino-ESP32 2.x and 3.x.
; 6.9.0 = Arduino-ESP32 2.0.17. The code also has a guarded path for 3.x.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions_custom.csv
build_flags =
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
lib_deps =
	mobizt/ESP Mail Client@^3.4.24
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager@^2.0.17
